html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
[data-theme=royal]{--bg:#5A0F1E;--bg2:#480B17;--ink:#F7E9CF;--acc:#E0B25A;--card:rgba(255,255,255,.07);--btn:#E0B25A;--btn-ink:#3A0912}
[data-theme=garden]{--bg:#DEDDC9;--bg2:#DDD8C4;--ink:#3B2A1E;--acc:#B2495F;--card:rgba(255,255,255,.62);--btn:#B2495F;--btn-ink:#fff}
[data-theme=midnight]{--bg:#0E1836;--bg2:#091126;--ink:#E9ECF7;--acc:#A9BEFF;--card:rgba(255,255,255,.06);--btn:#A9BEFF;--btn-ink:#091126}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Jost,system-ui,sans-serif;transition:background .4s}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
[data-theme=royal] body::before{border:1px solid var(--acc);margin:10px;outline:1px solid var(--acc);outline-offset:-6px;opacity:.7}
[data-theme=garden] body::before{background:radial-gradient(circle at 10% 8%,#F3C9D2 0,transparent 30%),radial-gradient(circle at 92% 92%,#BFD5B8 0,transparent 34%)}
[data-theme=midnight] body::before{background:radial-gradient(1.5px 1.5px at 20% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 30%,#fff,transparent),radial-gradient(1px 1px at 40% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 75%,#fff,transparent),radial-gradient(1px 1px at 10% 85%,#fff,transparent);opacity:.7}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 22px 120px;text-align:center}
section{padding:56px 0 8px}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:13vh;background:#DEDDC9 var(--art) no-repeat center bottom/cover;color:#3B2A1E;text-shadow:0 0 10px rgba(255,255,255,.75)}
#cover .small,.hero .small,#cover .names span,.hero .names span{color:#9C3B2E}
.welcome{max-width:440px;font:italic 500 21px/1.5 'Cormorant Garamond',Georgia,serif;margin:12px 0 0}
.small{letter-spacing:.06em;color:var(--acc)}
.names{font-style:italic;font-size:clamp(52px,15vw,84px);line-height:1.05;margin:14px 0}
.names span{display:block;font-size:.45em;color:var(--acc)}
.date{font-family:'Cormorant Garamond',serif;font-size:24px}
h2{font-size:34px;font-style:italic;margin-bottom:18px;color:var(--acc)}
.cd{display:flex;justify-content:center;gap:12px}
.cd div{background:var(--card);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:14px;min-width:70px;padding:12px 6px}
.cd b{display:block;font:500 30px 'Cormorant Garamond',serif}
.cd small{color:var(--acc)}
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:16px;padding:18px;margin:12px 0}
.card h3{margin:0;font:600 22px 'Cormorant Garamond',serif;font-style:italic}
iframe{width:100%;height:260px;border:0;border-radius:14px;margin-top:10px;background:var(--card)}
.btn{display:inline-block;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:12px 24px;font:500 15px Jost,sans-serif;text-decoration:none;cursor:pointer;margin:6px 4px}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--acc)}
form{text-align:left}
label{display:block;margin:14px 0 4px;font-weight:500}
input[type=text],input[type=number],textarea{width:100%;padding:12px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--acc) 50%,transparent);background:var(--card);color:var(--ink);font:inherit}
.opts{display:flex;gap:10px}
.opts label{flex:1;margin:0;border:1.5px solid color-mix(in srgb,var(--acc) 50%,transparent);border-radius:10px;padding:11px;text-align:center;cursor:pointer}
.opts input{position:absolute;opacity:0}
.opts label:has(input:checked){background:var(--btn);color:var(--btn-ink)}
.opts label:has(input:focus-visible),.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.send{text-align:center;margin-top:16px}
#cover{position:fixed;inset:0;z-index:20;background:#DEDDC9 var(--art) no-repeat center bottom/cover;color:#3B2A1E;text-shadow:0 0 10px rgba(255,255,255,.75);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:13vh !important;text-align:center;padding:24px;transition:opacity .7s,visibility .7s}
#cover.gone{opacity:0;visibility:hidden}
.env{font-size:64px;margin-bottom:6px}
#dock{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:1px solid color-mix(in srgb,var(--acc) 40%,transparent);display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:13px}
#dock button{border:1.5px solid var(--acc);background:none;color:var(--ink);border-radius:999px;padding:6px 13px;font:inherit;cursor:pointer}
#dock button[aria-pressed=true]{background:var(--btn);color:var(--btn-ink)}
#mus{position:fixed;z-index:11;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--acc);background:var(--bg2);color:var(--ink);font-size:18px;cursor:pointer}
#petals{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
#petals span{position:absolute;top:-10vh;line-height:1;animation:fall linear both;will-change:transform}
@keyframes fall{to{transform:translate(var(--dx),120vh) rotate(var(--r))}}
/* bold dark text (accent-coloured text keeps its original weight) */
body,.hero,#cover{font-weight:700}
.names,.date,.welcome,.card h3,.cd b,.btn.ghost{font-weight:700}
.small,.cd small{font-weight:400}
.names span{font-weight:500}
.welcome{color:#000;font-weight:700;-webkit-text-stroke:.6px #000;paint-order:stroke fill}
@media (min-aspect-ratio:1/1){#cover,.hero{background-size:auto 100%}}
@media (prefers-reduced-motion:reduce){#petals{display:none}html{scroll-behavior:auto}#cover{transition:none}}
</style>
</head>

<div id="petals" aria-hidden="true"></div>
<div id="cover">
    <div class="medium">You are invited</div>
  <h1 class="names" id="cn"></h1>
  <button class="btn" id="open">Open invitation</button>
 
</div>
<button id="mus" aria-label="Music on or off" aria-pressed="false">♪</button>
<main>
  <section class="hero">
    <h1 class="names" id="hn"></h1>
    <div class="date" id="hd"></div>
    <p class="small" id="hv"></p>
    <p class="welcome" id="wl"></p>
  </section>
  <div class="card-container">
   
   
  </div>
</main>

  <section><h2>Counting down</h2><div class="cd" id="cd"></div></section>
  <section><h2>The celebration</h2><div id="ev"></div></section>
  <section><h2>Find us here</h2>
    <div class="card"><h3 id="vn"></h3><div id="va"></div>
      <iframe id="map" title="Venue map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <a class="btn" id="open-map" target="_blank" rel="noopener">Open in Google Maps</a>
      <a class="btn ghost" id="dir" target="_blank" rel="noopener">Get directions</a>
    </div>
  </section>
  <p class="large" style="margin: top 150px"><strong></strong><bold>We can't wait to celebrate with you.</bold></strong></p>
</main>
<script>
/* ===== EDIT THESE DETAILS ===== */
const CFG={
  a:"Nishi", b:"Aranyam",
  when:"2027-03-01T11:00:00",
  venue:"Own residence",
  //address:"",                     // optional address text
  pin:"26.723217,94.223531",
  events:[["Juroon","11:00 AM","Monday, 1 March 2027"],["Reception","1:00 PM – 8:00 PM","Monday, 1 March 2027"],["Samudaan","11:00 PM","Monday, 1 March 2027"]],
  theme:"garden"
};
/* ================================ */
const $=id=>document.getElementById(id);
const nm=`${CFG.a}<span>&amp;</span>${CFG.b}`;
$("cn").innerHTML=nm;$("hn").innerHTML=nm;
const D=new Date(CFG.when);
$("wl").textContent=`With hearts full of love and families by our sides we cordially invite you to share in the joy of our wedding celebration. Your presence means the world to us.`;
$("hd").textContent=D.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
//if(CFG.venue)$("hv").textContent=CFG.venue;else $("hv").remove();
$("ev").innerHTML=CFG.events.map(e=>`<div class="card"><h3>${e[0]}</h3><div>${e[1]}</div><div class="small">${e[2]}</div></div>`).join("");
$("vn").textContent=CFG.venue||"Venue location";$("va").textContent=CFG.address;
const q=CFG.pin;
$("map").src="https://www.google.com/maps?q="+q+"&output=embed";
$("open-map").href="https://www.google.com/maps/search/?api=1&query="+q;
$("dir").href="https://www.google.com/maps/dir/?api=1&destination="+q;
function tick(){
  let s=Math.max(0,Math.floor((D-new Date())/1000));
  const v=[["Days",Math.floor(s/86400)],["Hours",Math.floor(s%86400/3600)],["Mins",Math.floor(s%3600/60)],["Secs",s%60]];
  $("cd").innerHTML=v.map(x=>`<div><b>${x[1]}</b><small>${x[0]}</small></div>`).join("");
}
tick();setInterval(tick,1000);
function theme(t){document.body.dataset.theme=t;document.querySelectorAll("#dock button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t))}
document.querySelectorAll("#dock button").forEach(b=>b.onclick=()=>theme(b.dataset.t));
theme(CFG.theme);
/* Wedding music (embedded audio) */
let on=false;const song=$("song");
function music(x){on=x;$("mus").setAttribute("aria-pressed",x);$("mus").textContent=x?"♪":"🔇";if(x){song.play().catch(()=>{on=false;$("mus").textContent="🔇"})}else song.pause()}
$("mus").onclick=()=>music(!on);
function shower(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const box=$("petals"),E=["🌸","🌺","🌼","🌷","🏵️","🏵️","🏵️"]; //U+1f3f5 (rosette appears 3x as often)
  for(let i=0;i<84;i++){const p=document.createElement("span");p.textContent=E[i%E.length];
    p.style.cssText=`left:${Math.random()*100}%;font-size:${16+Math.random()*16}px;--dx:${(Math.random()-.5)*160}px;--r:${(Math.random()-.5)*900}deg;animation-duration:${4+Math.random()*3.5}s;animation-delay:${Math.random()*2.6}s`;
    box.appendChild(p)}
  setTimeout(()=>{box.innerHTML=""},10500);

  
}
$("open").onclick=()=>{$("cover").classList.add("gone");music(true);shower()};
</script>
</body>
